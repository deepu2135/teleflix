name: Build Standalone Teleflix APK
# Automated APK build & release workflow

on:
  push:
    branches: [ master, main, standalone-app ]
  pull_request:
    branches: [ master, main, standalone-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teleflix-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Get Short SHA
        id: slug
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "Teleflix v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 📱 Teleflix - Auto Build

            **Commit:** `${{ steps.slug.outputs.sha }}`
            **Branch:** `master`

            ### Key Features
            - **Dual-Mode Catalogs:** Switch seamlessly between Cinemeta movies/series & Monitored Telegram Channels
            - **Live Video Thumbnails & Posters:** Widescreen 16:9 thumbnails for video items & real human-readable Telegram chat titles
            - **Real-Time Split & ZIP Archive Streaming:** Automatic grouping of split archives (`.001/.002`, `.part1`, `.zip`) with on-the-fly streaming directly from Telegram cloud without extracting
            - **Intelligent Caption Parsing:** Automatically resolves titles from video captions for educational lectures and unnamed media
            - **Built-in & External Player Integration:** Smooth resumption & playback in ExoPlayer, VLC, MX Player, and MPV

            ### Install
            Download `app-debug.apk` below and install on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
